<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff4d6d">
<meta name="apple-mobile-web-app-title" content="กินอะไรดี">
<title>มื้อนี้กินอะไรดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1efff; --card:#ffffff; --ink:#1f1747; --mute:#6b6590; --line:#dcd8f5;
  --accent:#ff4d6d; --accent-ink:#ffffff; --chip:#e6e2fb; --danger:#c62848;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15112b; --card:#201a3f; --ink:#f3f0ff; --mute:#a9a3d1; --line:#352e63;
    --accent:#ff6b86; --accent-ink:#1a0b14; --chip:#2b2457; --danger:#ff8da2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15112b; --card:#201a3f; --ink:#f3f0ff; --mute:#a9a3d1; --line:#352e63;
  --accent:#ff6b86; --accent-ink:#1a0b14; --chip:#2b2457; --danger:#ff8da2; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif;line-height:1.6;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:24px 18px 48px}
h1{font-family:'Mitr','Noto Sans Thai',sans-serif;font-weight:600;font-size:clamp(32px,9vw,44px);line-height:1.15;margin:4px 0 16px;letter-spacing:-.01em}
.tabs{display:flex;background:var(--chip);border-radius:18px;padding:5px;gap:4px;margin-bottom:20px}
.tab{flex:1;font:inherit;font-family:'Mitr','Noto Sans Thai',sans-serif;font-size:16px;border:none;background:none;color:var(--mute);padding:10px 8px;border-radius:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(40,20,90,.14)}
.stage{background:color-mix(in srgb,var(--accent) 12%,var(--card));border:2px solid color-mix(in srgb,var(--accent) 35%,var(--card));border-radius:32px;padding:26px 20px 24px;text-align:center}
.photo{width:min(260px,68vw);aspect-ratio:240/248;margin:0 auto 14px;border-radius:28px;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:80px;box-shadow:0 8px 24px rgba(60,30,120,.18)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.name{font-family:'Mitr','Noto Sans Thai',sans-serif;font-weight:500;font-size:clamp(25px,7vw,32px);line-height:1.25;margin:0;min-height:2.5em;display:flex;align-items:center;justify-content:center}
.stage.spin .photo{animation:wob .22s linear infinite}
.stage.land .photo{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes wob{0%,100%{transform:rotate(-4deg) scale(.97)}50%{transform:rotate(4deg) scale(1.03)}}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;font:inherit;font-family:'Mitr','Noto Sans Thai',sans-serif;font-size:19px;font-weight:500;border:none;border-radius:20px;padding:15px 12px;cursor:pointer;text-align:center;text-decoration:none;display:block;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.done{margin-top:16px;text-align:center}
.done p{margin:0 0 12px;font-weight:500}
.done .actions{margin-top:0}
details{margin-top:22px;background:var(--card);border-radius:22px;padding:4px 14px 14px}
summary{cursor:pointer;font-family:'Mitr','Noto Sans Thai',sans-serif;font-size:17px;padding:12px 0;list-style-position:inside}
.sel-top{display:flex;justify-content:flex-end;margin-bottom:8px}
.link{font:inherit;font-size:13px;background:none;border:none;color:var(--mute);cursor:pointer;text-decoration:underline;padding:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--accent);border-radius:16px;padding:6px;cursor:pointer;text-align:center;font-size:12px;line-height:1.3;transition:opacity .15s,filter .15s}
.thumb img{width:100%;aspect-ratio:240/248;object-fit:cover;border-radius:10px;background:#fff;display:block;margin-bottom:5px}
.thumb[aria-pressed="false"]{opacity:.45;filter:grayscale(1);border-color:var(--line)}
.hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hhead h2{font-family:'Mitr','Noto Sans Thai',sans-serif;font-weight:500;font-size:20px;margin:0}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:10px 12px 10px 10px}
.item img{width:72px;height:74px;border-radius:14px;object-fit:cover;background:#fff;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-family:'Mitr','Noto Sans Thai',sans-serif;font-weight:500;font-size:17px;line-height:1.3}
.item .t span{display:block;font-size:13px;color:var(--mute)}
.del{font:inherit;font-size:14px;background:none;border:2px solid var(--line);color:var(--danger);border-radius:12px;padding:6px 12px;cursor:pointer}
.empty{background:var(--card);border-radius:22px;padding:32px 20px;text-align:center;color:var(--mute)}
.empty .big{font-size:48px;line-height:1.2}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.stage.spin .photo,.stage.land .photo{animation:none}}
</style>
</head>
<body>
<main>
  <h1>มื้อนี้กินอะไรดี</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-spin" aria-selected="true" data-tab="spin" type="button">สุ่มเมนู</button>
    <button class="tab" role="tab" id="tab-hist" aria-selected="false" data-tab="hist" type="button">ประวัติ</button>
  </div>

  <section id="p-spin" role="tabpanel">
    <div class="stage" id="stage" aria-live="polite">
      <div class="photo" id="photo"><span id="ph">🍽️</span><img id="img" alt="" hidden></div>
      <h2 class="name" id="name">หิวแล้วใช่ไหม?</h2>
    </div>
    <div id="actions"></div>
    <details id="sel">
      <summary id="selsum">เลือกเมนูที่ให้สุ่ม</summary>
      <div class="sel-top"><button class="link" id="all" type="button"></button></div>
      <div class="grid" id="grid"></div>
    </details>
  </section>

  <section id="p-hist" role="tabpanel" hidden>
    <div class="hhead"><h2 id="hcount">เมนูที่กินแล้ว</h2><button class="link" id="clear" type="button">ล้างทั้งหมด</button></div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden><div class="big">🍽️</div><p>ยังไม่มีประวัติ<br>กด “กินอันนี้!” ในหน้าสุ่มเมนูเพื่อบันทึกไว้</p></div>
  </section>
</main>

const BY=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const $=s=>document.querySelector(s);
let on=new Set(ITEMS.map(i=>i.id)),cur=null,busy=false,hist=[],clearArm=false;
try{hist=JSON.parse(localStorage.getItem('eatHist2')||'[]').filter(h=>BY[h.id])}catch(e){hist=[]}
function save(){try{localStorage.setItem('eatHist2',JSON.stringify(hist))}catch(e){}}
function active(){return ITEMS.filter(i=>on.has(i.id))}
function pool(){
  const recent=hist.slice(0,3).map(h=>h.id);
  const p=active();
  const f=p.filter(i=>!recent.includes(i.id)&&(!cur||i.id!==cur.id));
  return f.length?f:p;
}
function renderGrid(){
  $('#grid').innerHTML=ITEMS.map(i=>`<button type="button" class="thumb" data-id="${i.id}" aria-pressed="${on.has(i.id)}"><img src="${i.img}" alt=""><span>${i.n}</span></button>`).join('');
  syncSel();
}
function syncSel(){
  $('#selsum').textContent=`เลือกเมนูที่ให้สุ่ม (${on.size}/${ITEMS.length})`;
  $('#all').textContent=on.size===ITEMS.length?'ล้างทั้งหมด':'เลือกทั้งหมด';
  document.querySelectorAll('#actions [data-do="spin"]').forEach(b=>b.disabled=!on.size);
}
function show(i){
  $('#img').src=i.img;$('#img').hidden=false;$('#ph').hidden=true;
  $('#name').textContent=i.n;
}
function actions(state){
  const a=$('#actions');
  if(state==='idle'){
    a.innerHTML=`<div class="actions"><button class="btn main" data-do="spin">สุ่มเมนูเลย!</button></div>`;
  }else if(state==='result'){
    a.innerHTML=`<div class="actions"><button class="btn alt" data-do="spin">สุ่มใหม่</button><button class="btn main" data-do="eat">กินอันนี้!</button></div>`;
  }else if(state==='spin'){
    a.innerHTML=`<div class="actions"><button class="btn main" disabled>กำลังสุ่ม…</button></div>`;
  }else{
    const q=encodeURIComponent(cur.n+' ใกล้ฉัน');
    a.innerHTML=`<div class="done"><p>บันทึกแล้ว มื้อนี้ ${cur.n}!</p><div class="actions"><a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${q}">หาร้านใกล้ฉัน</a><button class="btn main" data-do="spin">สุ่มมื้อถัดไป</button></div></div>`;
  }
  syncSel();
}
function spin(){
  if(busy||!on.size)return;
  busy=true;actions('spin');
  const st=$('#stage');
  const p=pool();
  const final=p[Math.floor(Math.random()*p.length)];
  const all=active();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const steps=reduce?0:14;
  let t=0;
  st.classList.remove('land');
  if(steps)st.classList.add('spin');
  (function tick(){
    if(t<steps){
      show(all[Math.floor(Math.random()*all.length)]);
      t++;
      setTimeout(tick,60+t*t*2.4);
    }else{
      st.classList.remove('spin');
      cur=final;show(final);
      if(!reduce){st.classList.add('land');setTimeout(()=>st.classList.remove('land'),600)}
      busy=false;actions('result');
    }
  })();
}
function eat(){
  hist.unshift({uid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),id:cur.id,t:Date.now()});
  save();renderHist();actions('done');
}
function fmt(t){
  const d=new Date(t);
  const date=d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
  const time=d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});
  return `${date} · ${time} น.`;
}
function renderHist(){
  $('#tab-hist').textContent=hist.length?`ประวัติ (${hist.length})`:'ประวัติ';
  $('#empty').hidden=!!hist.length;
  $('#clear').hidden=!hist.length;
  $('#hcount').textContent=hist.length?`กินไปแล้ว ${hist.length} มื้อ`:'เมนูที่กินแล้ว';
  clearArm=false;$('#clear').textContent='ล้างทั้งหมด';
  $('#list').innerHTML=hist.map(h=>{const i=BY[h.id];return `<li class="item"><img src="${i.img}" alt=""><div class="t"><b>${i.n}</b><span>${fmt(h.t)}</span></div><button type="button" class="del" data-uid="${h.uid}" aria-label="ลบ ${i.n}">ลบ</button></li>`}).join('');
}
function tab(n){
  ['spin','hist'].forEach(k=>{
    $('#p-'+k).hidden=k!==n;
    $('#tab-'+k).setAttribute('aria-selected',String(k===n));
  });
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)tab(b.dataset.tab)});
$('#grid').addEventListener('click',e=>{
  const b=e.target.closest('[data-id]');if(!b||busy)return;
  const id=b.dataset.id;
  on.has(id)?on.delete(id):on.add(id);
  b.setAttribute('aria-pressed',String(on.has(id)));
  syncSel();
});
$('#all').addEventListener('click',()=>{
  if(busy)return;
  on=on.size===ITEMS.length?new Set():new Set(ITEMS.map(i=>i.id));
  renderGrid();
});
$('#actions').addEventListener('click',e=>{
  const b=e.target.closest('[data-do]');if(!b)return;
  b.dataset.do==='spin'?spin():eat();
});
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-uid]');if(!b)return;
  hist=hist.filter(h=>h.uid!==b.dataset.uid);save();renderHist();
});
$('#clear').addEventListener('click',()=>{
  if(!clearArm){clearArm=true;$('#clear').textContent='กดอีกครั้งเพื่อยืนยัน';return}
  hist=[];save();renderHist();
});
renderGrid();renderHist();actions('idle');
</script>
</body>
</html>
